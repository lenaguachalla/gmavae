name_expe: coil_randomaction0/k2
lr: 0.001
metrics: [groups, prediction, reconstruction, norm_z]
batch_size: 16
epoch: 2.5e+5
seed: range(5)
dataset: 
  name: coil/randomaction0
  n_actions_per_state: 2
  m: 5
algo_specs:
  type: gmavae
  z_dim: 13
  lamda_r: 1
  lamda_a: 0.3
  focal_loss: 1
  group_masking: false
  action_specs:
    type: dense
    activation_fn: tanh
  image_specs:
    type: ae
    z_noise: 0.1
    encoder_specs:
      type: conv2d
      hidden_channels: [32,64]
      kernel_size: 8
      pooling: null
      stride: 4
      padding: 2
      hidden_dim: [256]
    decoder_specs:
      type: deconv2d
      hidden_channels: [64,32]
      kernel_size: 8
      pooling: null
      stride: 4
      padding: 2
      hidden_dim: [256]
      final_activation_fn: sigmoid