name_expe: mpi3d_noisy/gmavae
lr: 0.001
metrics: [prediction,reconstruction, entropy, dim, inde]
batch_size: 16
epoch: 1.e+5
seed: range(5)
dataset: 
  name: mpi3d/lie
  m: 5
  action_noise_std: .63
algo_specs:
  type: gmavae
  z_dim: 4
  lamda_r: 1
  lamda_a: 0.1
  group_masking: true
  lamda_d: 1.e-3
  target_d:
    type: affine
    values: [1.1,0]
    timesteps: [5.e+4,8.e+4]
  action_specs:
    type: dense_continuous
    hidden_dims: [256,256]
    activation_fn: tanh
  image_specs:
    type: ae
    z_noise: 0.1
    encoder_specs:
      type: conv2d
      hidden_channels: [32,64]
      kernel_size: 8
      pooling: null
      stride: 4
      padding: 2
      hidden_dim: [256]
    decoder_specs:
      type: deconv2d
      hidden_channels: [64,32]
      kernel_size: 8
      pooling: null
      stride: 4
      padding: 2
      hidden_dim: [256]
      final_activation_fn: sigmoid