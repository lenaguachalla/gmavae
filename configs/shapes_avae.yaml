name_expe: shapes2/avae
lr: 0.001
metrics: [prediction, reconstruction, norm_z, inde]
batch_size: 16
epoch: 2.e+5
seed: range(5)
dataset: 
  name: shapes/ss2
  m: 5
algo_specs:
  type: gmavae
  z_dim: 15
  lamda_r: 1
  lamda_a: 0.1
  focal_loss: 1
  group_masking: false
  action_specs:
    type: dense
    activation_fn: tanh
  image_specs:
    type: ae
    z_noise: 0.1
    encoder_specs:
      type: conv2d
      hidden_channels: [32,64]
      kernel_size: 8
      pooling: null
      stride: 4
      padding: 2
      hidden_dim: [256]
    decoder_specs:
      type: deconv2d
      hidden_channels: [64,32]
      kernel_size: 8
      pooling: null
      stride: 4
      padding: 2
      hidden_dim: [256]
      final_activation_fn: sigmoid